# One place for the app's identity and version, read by build.sh and build.gradle.
# Raise versionCode by 1 for every release you upload or share.
applicationId=pk.abcrides.app
versionCode=4
versionName=1.3
minSdk=23
targetSdk=36
defaultServer=https://abc-rides.onrender.com

# Firebase (push notifications), from Firebase console → Project settings →
# Your apps → pk.abcrides.app (the values in google-services.json). These are
# not secrets; they only identify the app. Empty = no push in the app.
firebaseProjectId=
firebaseAppId=
firebaseApiKey=
firebaseSenderId=
