# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
# The free plan has no persistent disk. Set DATABASE_URL to a free PostgreSQL
# database (Neon) and all data is backed up there and restored after every
# restart or deploy. DEMO_SEED fills an empty database with demo users and
# rides; the server pings itself every 10 minutes so it doesn't fall asleep.
services:
  - type: web
    name: abc-rides
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_SEED
        value: "1"
      - key: ADMIN_EMAILS
        sync: false
      # postgresql://... connection string of a free Neon database.
      - key: DATABASE_URL
        sync: false
      # Optional: your SMS provider's send URL with {to} and {message}
      # placeholders. Without it, phone codes are shown on screen (test mode).
      - key: SMS_GATEWAY_URL
        sync: false
