plugins {
    id 'com.android.application' version '8.12.0'
}

def app = new Properties()
file('app.properties').withInputStream { app.load(it) }
def server = System.getenv('DEFAULT_SERVER_URL') ?: app.defaultServer

android {
    namespace 'pk.abcrides.app'
    compileSdk 36

    defaultConfig {
        applicationId(app.applicationId as String)
        minSdk((app.minSdk as String).toInteger())
        targetSdk((app.targetSdk as String).toInteger())
        versionCode((System.getenv('VERSION_CODE') ?: app.versionCode as String).toInteger())
        versionName(app.versionName as String)
        buildConfigField 'String', 'DEFAULT_SERVER', "\"${server.replaceAll('/+$', '')}\""
        // Firebase reads these resources to start itself (what google-services.json
        // would normally provide). Left out when app.properties has no Firebase values.
        if (app.firebaseAppId) {
            resValue 'string', 'google_app_id', app.firebaseAppId
            resValue 'string', 'gcm_defaultSenderId', app.firebaseSenderId
            resValue 'string', 'google_api_key', app.firebaseApiKey
            resValue 'string', 'project_id', app.firebaseProjectId
        }
    }

    buildFeatures { buildConfig true }

    // Same folders build.sh uses.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            // src-fcm: Firebase push, which build.sh (no Firebase SDK) leaves out.
            java.srcDirs = ['src', 'src-fcm']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    // The Play upload key comes from GitHub secrets (see the workflow). Without
    // them the release build is left unsigned, to be signed with the app's own
    // key afterwards (so it installs over earlier versions).
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Keep Gradle's output apart from build.sh's android/build folder.
layout.buildDirectory = file('build/gradle')

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-messaging'
}
