# Builds the Android app for Google Play on GitHub's free runners.
#
# Output (Actions → this run → Artifacts):
#   abc-rides-aab: app-release.aab  upload this to Play Console
#   abc-rides-apk: app-release.apk  install directly on phones
#
# Signing for Play: create an upload key once, e.g.
#   keytool -genkeypair -v -keystore upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000
# then add these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  output of: base64 -w0 upload.jks
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (e.g. upload), ANDROID_KEY_PASSWORD
# Keep upload.jks and its passwords safe. Without the secrets the build is
# signed with a temporary debug key (fine for testing, not accepted by Play).
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: Server address baked into the app (blank = app.properties)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Prepare the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key. Play Console will not accept this bundle."
          fi

      - name: Build bundle and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEFAULT_SERVER_URL: ${{ inputs.server_url }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: abc-rides-aab
          path: android/build/gradle/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: abc-rides-apk
          path: android/build/gradle/outputs/apk/release/*.apk
